plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.24'
}

version = '1.2.0'
group = 'com.harderdiesel'

base {
    archivesName = 'harderdiesel'
}

// В имени папки проекта есть двоеточие («create: harder disel»), а для Java оно
// является разделителем записей classpath. Из-за этого gradlew и javac не находят
// свои jar-файлы. Переносим каталог сборки в соседнюю папку без двоеточия.
buildDir = file('../harderdiesel-build')

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Локальные jar: flatDir по ':' не бьётся, jar лежат в libs/ и корне проекта
    flatDir {
        name = 'localLibs'
        dirs 'libs', '.'
    }
    mavenCentral()
    maven {
        name = 'BlameJared' // официальный maven JEI (mezz.jei)
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Xaero'
        url = 'https://chocolateminecraft.com/maven'
        content {
            includeGroup 'xaero.lib'
            includeGroup 'xaero.minimap'
            includeGroup 'xaero.map'
            includeGroup 'xaero.pvp'
        }
    }
}

dependencies {
    // Моды для dev-окружения (runClient) и runtime.
    // NEI для 1.21.1 не существует — его преемник это JEI, поэтому ставим JEI.
    // JEI берём с официального maven (maven.blamejared.com): на Modrinth Maven
    // у JEI один номер версии на все загрузчики, и maven отдаёт fabric-версию.
    implementation "mezz.jei:jei-1.21.1-neoforge:19.27.0.340"
    implementation "maven.modrinth:create:6.0.10+mc1.21.1"
    implementation "maven.modrinth:create-diesel-generators:1.21.1-1.3.12"
    // Create's transitive client/runtime libs that moddev doesn't put on the compile classpath.
    // They ARE present at runtime (Create pulls them in), so compileOnly avoids duplicate JPMS modules.
    // catnip/ponder качаются с maven.createmod.net, flywheel/Registrate — из flatDir ../harderdiesel-build/libs.
    compileOnly "net.createmod.catnip:Catnip-NeoForge-1.21.1:0.8.54"
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly name: 'flywheel-neoforge-1.21.1-1.0.6', ext: 'jar'
    compileOnly name: 'Registrate-MC1.21-1.3.0+67', ext: 'jar'
    // Для веток нитро-топлива и гидрообработки дизеля (рецепты условны, завязаны на эти моды).
    // power-grid грузим локальным jar'ом через flatDir (../harderdiesel-build/libs):
    // на Modrinth Maven у версии 0.5.5.1 одна координата на все загрузчики,
    // и maven отдаёт forge-1.20.1 вместо neoforge-1.21.1.
    implementation name: 'powergrid-mc1.21.1-0.5.5.1', ext: 'jar'
    // XaerosZones — Pollution API (compileOnly + runtime в dev; код обращается через рефлексию, без краша если нет)
    compileOnly name: 'xaeroszones-2.1.0', ext: 'jar'
    implementation name: 'xaeroszones-2.1.0', ext: 'jar'
    // Xaero's Lib / World Map / Minimap — dev-окружение из официального maven (chocolateminecraft.com)
    // Требуются для xaeroszones, иначе краш ISyncedPlayerTrackerSystem/xaerolib
    implementation "xaero.lib:xaerolib-neoforge-1.21.1:1.7.1"
    implementation "xaero.map:xaeroworldmap-neoforge-1.21.1:1.44.2"
    implementation "xaero.minimap:xaerominimap-neoforge-1.21.1:26.4.2"
    // Recipe Viz — клиентский аддон к JEI для визуализации дерева рецептов (тестовое окружение).
    implementation name: 'recipeviz-1.0.8', ext: 'jar'
    // powergrid требует architectury >= 13.0.8 (обязательная зависимость).
    implementation "dev.architectury:architectury-neoforge:13.0.11"
    implementation "maven.modrinth:create-broken-bad-fabric:1.1.3"
    implementation "maven.modrinth:create-propulsion-simulated:1.1.5"
    implementation "maven.modrinth:sable:2.0.4+mc1.21.1"
    implementation "maven.modrinth:create-aeronautics:1.3.1+mc1.21.1"
}

neoForge {
    version = '21.1.248'

    mods {
        harderdiesel {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }
}

// Модели, языки и текстуры хранятся отдельно от кода — в textures/neoforge
sourceSets.main.resources.srcDir 'textures/neoforge'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
